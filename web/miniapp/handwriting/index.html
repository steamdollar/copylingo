<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="/miniapp/handwriting/assets/style.css?v=2608260859">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    </head>
    <body>
    <main class="shell">
      <section class="card">
        <div id="questionPanel" class="question-panel" hidden>
          <span class="question-eyebrow">문제</span>
          <p id="questionPrompt" class="question-prompt"></p>
        </div>
        <div class="pad-frame">
          <div id="padViewport" class="pad-viewport">
            <canvas id="pad" width="320" height="320" aria-label="손글씨 입력 패드"></canvas>
          </div>
          <p id="gradeResult" class="grade-result" aria-live="polite" hidden></p>
        </div>
        <label id="padScrollControl" class="pad-scroll-control" for="padScroll">
          <span>좌우 이동</span>
          <input id="padScroll" type="range" min="0" max="0" value="0">
        </label>
        <section id="overviewPanel" class="overview-panel">
          <span class="overview-eyebrow">전체 보기</span>
          <canvas id="overview" class="overview" aria-hidden="true"></canvas>
        </section>
        <div class="tools">
          <button id="undo" class="secondary" type="button">되돌리기</button>
          <button id="eraser" class="secondary" type="button">지우개</button>
          <button id="clear" class="secondary" type="button">전체 지우기</button>
        </div>
        <div class="actions actions-submit">
          <button id="submit" class="primary" type="button">제출하기</button>
        </div>
        <div id="loadingPanel" class="loading-panel" hidden>
          <div id="loadingHeader" class="loading-header">
            <span class="spinner" aria-hidden="true"></span>
            <span class="loading-title">채점 중입니다</span>
          </div>
          <div id="tipCard" class="tip-card" aria-live="polite" hidden>
            <span class="tip-eyebrow" id="tipEyebrow"></span>
            <p class="tip-body" id="tipBody"></p>
          </div>
        </div>
        <p id="status" class="status">준비됨</p>
      </section>
    </main>

    <script src="/miniapp/handwriting/assets/app.js?v=2608260853"></script>
  </body>
</html>
