server:
  port: 8080
  mode: debug
  public_base_url: ""  # Set via env: COPYLINGO_SERVER_PUBLIC_BASE_URL

db:
  host: localhost
  port: 5432
  user: copylingo
  password: copylingo
  dbname: copylingo
  sslmode: disable

redis:
  addr: localhost:6379
  password: ""
  db: 0

telegram:
  token: ""  # Set via env: COPYLINGO_TELEGRAM_TOKEN
  debug: true

llm:
  api_key: ""  # Set via env: COPYLINGO_LLM_API_KEY
  model: gemini-3.5-flash-lite
  tts_model: gemini-2.5-flash-preview-tts  # Gemini native TTS (ADR-031); reuses llm.api_key
  tts_voice_name: Kore                     # Gemini prebuilt voice (Kore/Puck/Zephyr/...)
  tts_voice_name_b: Puck                   # Speaker B in listening dialogues

storage:               # S3-compatible object store for TTS audio (ADR-032)
  endpoint: http://localhost:9000  # MinIO; empty => AWS S3 default endpoint
  region: ap-northeast-2           # Seoul
  bucket: copylingo-audio
  access_key: minioadmin           # override via env in prod
  secret_key: minioadmin           # override via env in prod
  use_path_style: true             # true for MinIO, false for AWS S3

logging:
  dir: ./logs
  level: INFO
  retention_days: 30
  timezone: Asia/Seoul
