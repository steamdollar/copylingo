services:
  postgres:
    image: postgres:16-alpine
    container_name: copylingo-db
    environment:
      POSTGRES_USER: copylingo
      POSTGRES_PASSWORD: copylingo
      POSTGRES_DB: copylingo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copylingo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: copylingo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO: S3-compatible object store for TTS audio (ADR-032). Local backend that
  # exercises the same S3 code path as prod AWS S3 (endpoint swap only).
  minio:
    image: minio/minio:latest
    container_name: copylingo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the audio bucket after MinIO is healthy, then exit.
  minio-createbucket:
    image: minio/mc:latest
    container_name: copylingo-minio-createbucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/copylingo-audio &&
      echo 'bucket copylingo-audio ready';
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copylingo-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      COPYLINGO_DB_HOST: postgres
      COPYLINGO_DB_PORT: 5432
      COPYLINGO_DB_USER: copylingo
      COPYLINGO_DB_PASSWORD: copylingo
      COPYLINGO_DB_DBNAME: copylingo
      COPYLINGO_DB_SSLMODE: disable
      COPYLINGO_REDIS_ADDR: redis:6379
      COPYLINGO_TELEGRAM_TOKEN: ${COPYLINGO_TELEGRAM_TOKEN}
      COPYLINGO_LLM_API_KEY: ${COPYLINGO_LLM_API_KEY}
      COPYLINGO_SERVER_PUBLIC_BASE_URL: ${COPYLINGO_SERVER_PUBLIC_BASE_URL}
      # Object storage: in-cluster the app reaches MinIO by service name.
      COPYLINGO_STORAGE_ENDPOINT: http://minio:9000
      COPYLINGO_STORAGE_REGION: ap-northeast-2
      COPYLINGO_STORAGE_BUCKET: copylingo-audio
      COPYLINGO_STORAGE_ACCESS_KEY: minioadmin
      COPYLINGO_STORAGE_SECRET_KEY: minioadmin
      COPYLINGO_STORAGE_USE_PATH_STYLE: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./data/audio:/app/data/audio
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  minio_data:
